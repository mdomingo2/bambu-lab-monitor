upstream backend {
    server backend:8000;
}

upstream go2rtc {
    server go2rtc:1984;
}

# Rate-limit zone for login attempts: 10 MB state, max 10 requests/minute per IP.
# The Python rate limiter is the primary guard; this is a fast early-exit at the
# nginx layer before the request ever reaches uvicorn.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_status 429;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Redirects to port 8443 — matches the host-side port in docker-compose.yml.
# If you change the compose port mapping, update this line to match.
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # TLS 1.2 + 1.3 only; strong cipher suite; let client pick order.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Reject scanner bait ──────────────────────────────────────────────────
    # Bots probe for routers, WordPress, PHP apps, and config files.
    # None of these extensions are valid in a React SPA — return 404 immediately
    # instead of falling through to the SPA fallback (which would log a 200).
    location ~* \.(cgi|php|asp|aspx|cfg|config|env|ini|bak|sql|sh|pl|rb|jsp|jspx|do|action|xml|yaml|yml|htaccess|htpasswd)$ {
        return 404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # index.html must never be cached so browsers always fetch the latest
    # hashed JS/CSS filenames after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Login rate limiting ───────────────────────────────────────────────────
    # burst=5 allows a short burst before throttling kicks in.
    # nodelay means burst requests are served immediately, not queued.
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Timelapse downloads ───────────────────────────────────────────────────
    # Videos are fetched over FTPS from the printer SD card and can be large.
    # Give it 10 minutes — must be listed before the generic /api/ block so
    # nginx uses this location for timelapse URLs.
    location ~* ^/api/printers/[^/]+/timelapses/[^/]+$ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout  5s;
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        proxy_buffering        off;      # stream bytes to client as they arrive
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── WebSocket proxy (live status feed) ────────────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    # ── go2rtc — REST API + WebRTC WebSocket signaling ────────────────────────
    # auth_request validates the session cookie against the backend before
    # forwarding to go2rtc.  go2rtc has no auth of its own, so without this
    # the full admin API (including printer RTSP credentials) is public.
    location /go2rtc/ {
        auth_request      /api/auth/me;
        auth_request_set  $auth_status $upstream_status;

        proxy_pass         http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
