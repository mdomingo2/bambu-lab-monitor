services:
  go2rtc:
    image: alexxit/go2rtc
    ports:
      - "127.0.0.1:1984:1984"  # Admin API — localhost only; nginx proxies /go2rtc/
      - "8555:8555/tcp"        # WebRTC media port — must be reachable from browser
    volumes:
      - ./go2rtc:/config
    environment:
      # HOST_IP: LAN IP of the machine running Docker.  The browser opens a
      # direct UDP/TCP connection to HOST_IP:8555 for the WebRTC video stream,
      # so this must be the IP your browser can actually reach.
      # Set it in a .env file alongside docker-compose.yml:
      #   echo "HOST_IP=192.168.1.50" > .env
      # The install.sh script on Raspberry Pi sets this automatically.
      - HOST_IP=${HOST_IP:-127.0.0.1}
    restart: unless-stopped

  backend:
    build: ./backend
    # Port 8000 is NOT exposed externally — all traffic reaches the backend
    # through the Nginx reverse proxy over HTTPS.  Uncomment the lines below
    # only if you need direct API access for local development or debugging.
    # ports:
    #   - "8000:8000"
    volumes:
      - bambu_data:/app/data
      - ./host_arp:/host_arp:ro        # host ARP table refreshed every minute by cron
    environment:
      - DATABASE_URL=sqlite:////app/data/bambu.db
      - GO2RTC_URL=http://go2rtc:1984
      # First-run admin credentials.  Set these in a .env file alongside
      # docker-compose.yml BEFORE the first start so you control the password.
      # If APP_PASSWORD is empty, a random password is auto-generated and
      # printed to the container logs on the very first boot.
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - go2rtc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "80:80"      # HTTP — immediately redirects to HTTPS
      - "8443:443"   # HTTPS — avoids conflict with system use of port 443
    volumes:
      - bambu_certs:/etc/nginx/certs  # TLS cert persisted across restarts
    environment:
      # Set to your Pi's LAN IP and/or hostname so the auto-generated
      # certificate includes them in its Subject Alternative Names.
      # Browsers use the SAN to validate the cert — without this you will
      # still get a one-time "proceed anyway" warning when accessing by IP.
      # Example:
      #   CERT_HOSTS=192.168.1.50,bambu.local
      - CERT_HOSTS=${CERT_HOSTS:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bambu_data:
  bambu_certs:   # Persists the TLS certificate across container rebuilds
